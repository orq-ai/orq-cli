name: Model bump

# `orq launch` hardcodes a default model per coding agent, and Claude Code's
# opus/sonnet/haiku set. model-candidates.py finds newer ids of the same shape
# in the public model catalogue; Claude Code then makes the edit (constants,
# comments, tests, README, changelog). Claude only edits: it runs on a
# read-only token, and the publish step below, which no agent touches, checks
# the changed paths and opens the PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  # Dry run on changes to this automation: everything but the publish step,
  # with the would-be diff in the run summary.
  pull_request:
    paths:
      - .github/workflows/model-bump.yml
      - .github/scripts/model-candidates.py

permissions:
  contents: read

concurrency:
  group: model-bump-${{ github.event_name }}
  cancel-in-progress: false

env:
  BRANCH: model-bump/auto

jobs:
  edit:
    name: bump default models to the newest served
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No id-token here: nothing in this job, the agent included, can mint a
    # token that writes. The patch leaves through the job outputs.
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.patch.outputs.patch }}
      body: ${{ steps.patch.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find newer models
        id: find
        run: |
          set -euo pipefail
          python3 .github/scripts/model-candidates.py "$RUNNER_TEMP/candidates.json" "$GITHUB_STEP_SUMMARY"
          echo "bump=$(jq 'length > 0' "$RUNNER_TEMP/candidates.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.find.outputs.bump == 'true'
        with:
          go-version-file: go.mod

      - name: Run Claude Code
        if: steps.find.outputs.bump == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # With github_token set the action skips its App token exchange.
          github_token: ${{ github.token }}
          claude_args: >-
            --model opus
            --max-turns 60
            --allowed-tools "Read,Edit,Write,Glob,Grep,Bash(go build:*),Bash(go vet:*),Bash(go test:*),Bash(gofmt:*),Bash(git diff:*),Bash(git status:*)"
          prompt: |
            Bump the `orq launch` default models listed in
            ${{ runner.temp }}/candidates.json: each entry names a Go constant,
            its file, the current id and the newest id to move it to. Read
            AGENTS.md first. Change only those constants, to exactly those ids.

            Then follow the bump through: comments that name a version (e.g.
            "No claude-haiku-5 exists yet"), tests that pin the old id, and
            README.md examples naming a bumped model. Grep the old ids across
            cli/custom and README.md. Add one entry under "## Unreleased" in
            CHANGELOG.md, per AGENTS.md.

            Verify with:
              go build ./... && go vet ./... && go test ./...
              gofmt -l cli/custom

            Edit nothing outside cli/custom, README.md and CHANGELOG.md.
            Finally write ${{ runner.temp }}/pr-body.md: a table of constant,
            old id and new id, and a line per non-obvious follow-on edit. This
            repo is public: no internal links or ticket ids, and no tool
            attribution footer.

      - name: Export the patch
        id: patch
        if: steps.find.outputs.bump == 'true'
        run: |
          set -euo pipefail
          git add -A -- cli/custom README.md CHANGELOG.md
          git diff --cached --quiet && { echo "::error::candidates found but Claude changed nothing"; exit 1; }
          [ -s "$RUNNER_TEMP/pr-body.md" ] || { echo "::error::no PR body written"; exit 1; }
          { echo '```diff'; git diff --cached; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "patch=$(git diff --cached --binary | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "body=$(base64 -w0 < "$RUNNER_TEMP/pr-body.md")" >> "$GITHUB_OUTPUT"

  publish:
    name: open or update the PR
    needs: edit
    if: needs.edit.outputs.patch != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Minted into a Claude GitHub App token: a PR opened with GITHUB_TOKEN
      # would trigger no CI.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply and check the patch
        env:
          PATCH: ${{ needs.edit.outputs.patch }}
          BODY: ${{ needs.edit.outputs.body }}
        run: |
          set -euo pipefail
          echo "$PATCH" | base64 -d > "$RUNNER_TEMP/bump.patch"
          echo "$BODY" | base64 -d > "$RUNNER_TEMP/pr-body.md"
          git apply --index "$RUNNER_TEMP/bump.patch"
          if git diff --cached --name-only | grep -Ev '^(cli/custom/.*|README\.md|CHANGELOG\.md)$'; then
            echo "::error::patch touches paths outside cli/custom, README.md and CHANGELOG.md (listed above)"; exit 1
          fi

      - name: Open or update the PR
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ponytail: the OIDC-for-App-token exchange claude-code-action does
          # internally (src/github/token.ts). Breaks if Anthropic moves that
          # endpoint; then run the action here with a no-op prompt instead.
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r .value)"
          GH_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer $oidc" \
            https://api.anthropic.com/api/github/github-app-token-exchange | jq -r '.token // .app_token')"
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN
          trap 'curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/installation/token || true' EXIT

          title="feat(launch): bump default models to the newest served"
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "$title"
          # One rolling branch: each run replaces the last proposal, so an
          # unmerged PR is refreshed rather than blocking or duplicated.
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
