name: PR title

# Validate the title independently of build and test checks. pull_request_target
# uses the default-branch workflow, so forked PRs receive the same title check.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate:
    name: pr title is a conventional commit
    # This workflow reads PR metadata only. Do not add a checkout or run
    # executable code from the pull request in this pull_request_target context.
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
