name: Release Pipeline

# Reusable release pipeline, called twice by release.yml: once for prod (root
# module, npm dist-tag latest) and once for rc (packages/orq-rc, dist-tag rc).
# It regenerates the
# CLI from the OpenAPI schema that orquesta-web committed, syncs the generated
# code back to main, tags + publishes a GitHub release, cross-compiles every
# platform binary, and publishes @orq-ai/cli to npm under the given dist-tag.
#
# The CLI version is the repo's own and comes from ./VERSION. A new orq API
# schema bumps the minor, any other change to main bumps the patch, and both
# take the next free tag; the major is the only field a human edits. rc builds
# become <next-minor>.0-rc.<n> prereleases, with n likewise the next free one. It is independent of the
# orq API version (.bartolo.json app_version, bumped by orquesta-web), which is
# recorded instead — in the release notes, in the binary (orq version), and in
# package.json's orqApiVersion.
on:
  workflow_call:
    inputs:
      module_dir:
        description: "Go module to release from ('' = repo root / prod, 'packages/orq-rc' = rc)"
        type: string
        required: false
        default: ''
      npm_dist_tag:
        description: "npm dist-tag to publish under (latest for prod, rc for pre-release)"
        type: string
        required: true
      bump:
        description: "'minor' when a new orq API schema landed, 'patch' for a CLI-only change"
        type: string
        required: false
        default: patch

# Serialize ALL releases, not just per module: both modules commit back to main
# and a stable run racing an rc run would lose its ref update (the PATCH is a
# fast-forward from the sha it read at checkout).
concurrency:
  group: release
  cancel-in-progress: false

env:
  MODULE_DIR: ${{ inputs.module_dir }}
  BUMP: ${{ inputs.bump }}

jobs:
  release:
    # macOS runner so `codesign` is available for ad-hoc signing the two darwin
    # binaries. Go's cross toolchain builds linux/windows fine from macOS.
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # persist-credentials required: the commit-back + tag push below write to
        # the repo with the GITHUB_TOKEN credential (contents: write).
        # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0
          # Explicit, because the next free patch version is resolved from the
          # local tag set: no tags would silently mean "v<base> is free".
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
          # Never build release binaries from a shared cache — a poisoned module
          # or build cache would end up inside the published artifacts.
          cache: false

      - name: Set up Node.js
        # setup-node's dependency cache is opt-in and not enabled here.
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config --global user.name "Orq GitHub Actions"
          git config --global user.email "admin@orq.ai"

      - name: Install bartolo
        run: |
          workdir="${MODULE_DIR:-.}"
          go install "github.com/orq-ai/bartolo@v0.4.6"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          workdir="${MODULE_DIR:-.}"

          # The CLI version is the repo's own, and lives in ./VERSION — one file
          # for both modules. Deliberately NOT in .bartolo.json: `bartolo
          # generate` rewrites that file from its own struct, so any field it
          # does not know about is silently dropped on the next regen.
          file_version="$(tr -d '[:space:]' < VERSION)"
          base="$file_version"
          # Leading zeros are rejected along with the obvious garbage: "5.08.0"
          # looks fine until $((minor + 1)) reads 08 as octal and the shell
          # aborts mid-release. npm rejects them too.
          if ! printf '%s' "$base" | grep -qE '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'; then
            echo "error: VERSION must be a bare major.minor.patch semver, got '$base'" >&2
            exit 1
          fi

          # The orq API line these commands were generated from. orquesta-web
          # writes it into .bartolo.json when it publishes a schema; it is
          # reported and recorded, never used to derive the tag.
          api_version="$(jq -r '.app_version' "$workdir/.bartolo.json")"
          if [ -z "$api_version" ] || [ "$api_version" = "null" ]; then
            echo "error: app_version missing in $workdir/.bartolo.json" >&2
            exit 1
          fi

          # Both lines number themselves off the tags that exist, so a re-run
          # after a mid-release failure allocates the NEXT free number instead
          # of colliding with the tag the failed attempt already created.
          #
          # Read from the local tag set (checkout is fetch-depth 0 with tags, so
          # it is complete) rather than probing the API tag by tag: one round of
          # per-number requests would fail OPEN on a rate limit or a network
          # blip - every error looks like "tag is free" - and hand back a
          # version that already exists.
          # first_free <prefix> <start>: smallest n >= start with no v<prefix><n> tag
          first_free() {
            taken="$(git tag --list "v$1*")"
            n="$2"
            while printf '%s\n' "$taken" | grep -qx "v$1$n"; do
              n=$((n + 1))
            done
            printf '%s' "$n"
          }

          if [ -n "${MODULE_DIR:-}" ]; then
            # An rc is the prerelease of the NEXT minor, so it always sorts
            # above the stable release it will succeed.
            major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"
            next="$major.$((minor + 1)).0"
            version="$next-rc.$(first_free "$next-rc." 1)"
            prerelease=true
          else
            # Nobody hand-edits the version for a release. A new orq API
            # schema is the one thing that can change what the commands are, so
            # it takes the minor; everything else — a CLI fix, an installer
            # change — takes the patch. The major is left to a human.
            #
            # A static rule, deliberately: deriving the bump from a diff of the
            # generated command surface would be more precise and would make
            # every release's number depend on a comparison that can itself be
            # wrong.
            if [ "${BUMP:-patch}" = "minor" ]; then
              major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"
              base="$major.$((minor + 1)).0"
            fi
            prefix="${base%.*}"
            version="$prefix.$(first_free "$prefix." "${base##*.}")"
            prerelease=false
            # Written back in the commit-back step below, so main always states
            # the version that was last released from it. Compared against the
            # file, not against $base, which the minor bump above rewrites.
            if [ "$version" != "$file_version" ]; then echo "$version" > VERSION; fi
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "api_version=$api_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (prerelease=$prerelease, orq API $api_version) from module '${MODULE_DIR:-root}'"

      - name: Regenerate CLI from schema
        run: |
          workdir="${MODULE_DIR:-.}"
          spec="$(jq -r '.last_spec_path' "$workdir/.bartolo.json")"
          ( cd "$workdir" && bartolo generate "$spec" )
          # Keep the committed command-surface manifest in lockstep with the
          # regenerated tree, or the CI surface gate fails on the regen
          # commit. The dump tool lives in the stable module only; RC
          # releases do not carry a manifest.
          if [ -z "${MODULE_DIR:-}" ]; then
            go run ./cmd/surface-dump -write
          fi

      - name: Commit regenerated code to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workdir="${MODULE_DIR:-.}"
          # Per path, because a single `git add a b c || true` cannot tell a
          # missing optional path (rc has no surface.json) from a real failure,
          # and swallowing the latter releases the previous generated tree.
          for path in "$workdir/cli/generated" "$workdir/examples" "$workdir/README.md" "$workdir/go.mod" "$workdir/go.sum" surface.json VERSION; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          # main requires verified signatures, so we cannot `git push` an unsigned
          # commit from the runner. Commits created through the GitHub Git Data API
          # with GITHUB_TOKEN are GPG-signed by GitHub and show up as Verified, so
          # we build the commit server-side and fast-forward the ref to it.
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse 'HEAD^{tree}')"

          # One tree entry per staged path. Existing files become a base64 blob;
          # deleted files carry a null sha so the API drops them from the tree.
          : > tree-items.jsonl
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ -f "$path" ]; then
              mode=100644
              [ -x "$path" ] && mode=100755
              base64 < "$path" | tr -d '\n' > blob.b64
              blob_sha="$(jq -n --rawfile c blob.b64 '{content:$c, encoding:"base64"}' \
                | gh api "repos/$REPO/git/blobs" --input - --jq .sha)"
              jq -nc --arg p "$path" --arg m "$mode" --arg s "$blob_sha" \
                '{path:$p, mode:$m, type:"blob", sha:$s}' >> tree-items.jsonl
            else
              jq -nc --arg p "$path" \
                '{path:$p, mode:"100644", type:"blob", sha:null}' >> tree-items.jsonl
            fi
          done < <(git diff --cached --name-only)

          new_tree="$(jq -sc --arg base "$base_tree" '{base_tree:$base, tree:.}' tree-items.jsonl \
            | gh api "repos/$REPO/git/trees" --input - --jq .sha)"
          new_commit="$(gh api "repos/$REPO/git/commits" \
            -f message="Regenerate CLI for $VERSION" \
            -f tree="$new_tree" \
            -f "parents[]=$base_sha" \
            --jq .sha)"
          gh api --method PATCH "repos/$REPO/git/refs/heads/main" -f sha="$new_commit"

          # Point local HEAD at the verified commit so the release is tagged there.
          git fetch origin main
          git reset --hard "$new_commit"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          API_VERSION: ${{ steps.version.outputs.api_version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # gh creates the tag itself, at the current HEAD (already pushed to
          # main by the commit-back step) — no separate `git tag`/`git push`
          # needed. For a draft the tag appears when the release is published,
          # in the last step.
          #
          # Notes are generated through the API rather than with
          # `--generate-notes` so the API line can be prepended to them: which
          # orq API a build speaks is the first thing a reader needs, and it is
          # no longer inferable from the version number.
          target="$(git rev-parse HEAD)"
          {
            printf 'Built against **orq API %s**.\n\n' "$API_VERSION"
            gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$target" --jq .body
          } > release-notes.md
          #
          # Created as a draft: a draft has no tag and does not answer
          # /releases/latest, so the window between "release exists" and "assets
          # uploaded" cannot serve an installer a release it cannot download
          # from. The last step publishes it.
          flags=(--draft --title "$TAG" --target "$target" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

      - name: Build all platform binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_VERSION: ${{ steps.version.outputs.api_version }}
        run: ./scripts/release-build.sh "$VERSION" "${MODULE_DIR}" "$API_VERSION"

      - name: Stage raw binaries for GitHub Release
        run: |
          set -e
          mkdir -p dist
          for pkgdir in npm/cli-*/; do
            name="$(basename "$pkgdir")"
            target="${name#cli-}"
            if [ "$target" = "win32-x64" ]; then
              cp "$pkgdir/bin/orq.exe" "dist/orq-$target.exe"
            else
              cp "$pkgdir/bin/orq" "dist/orq-$target"
            fi
          done
          ls -la dist/

      - name: Generate man pages
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          # Honor MODULE_DIR like every other step: an RC release must ship
          # man pages for the RC command tree, not the stable one.
          workdir="${MODULE_DIR:-.}"
          ( cd "$workdir" && go run -ldflags "-X main.version=${TAG#v}" ./cmd/orq man-pages --dir "$GITHUB_WORKSPACE/dist/man" )
          tar -czf dist/orq-man-pages.tar.gz -C dist man
          rm -rf dist/man

      - name: Generate checksums
        run: |
          set -e
          # Per-asset sha256 files; install.sh downloads and verifies them.
          cd dist
          for f in orq-*; do
            case "$f" in *.sha256) continue ;; esac
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload raw binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --clobber to overwrite asset already exist
          gh release upload "$TAG" dist/orq-* --clobber

      # Per-tag release asset, not a branch head: a bad commit there would break every install with no version to roll back to.
      - name: Publish install.sh to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed "s|^INSTALLER_VERSION=.*|INSTALLER_VERSION=\"${TAG}\"|" install.sh > dist/install.sh
          # Fails the release if sed matched nothing, rather than shipping an installer that reports "dev".
          grep -q "^INSTALLER_VERSION=\"${TAG}\"$" dist/install.sh
          # No `sh -n` here: macOS /bin/sh is bash in posix mode and accepts constructs dash rejects.
          # The real gate runs install.sh under dash in .github/workflows/ci.yml.
          # cd first: shasum records the path as written, so `shasum -c` from elsewhere would look for dist/.
          ( cd dist && shasum -a 256 install.sh > install.sh.sha256 )
          gh release upload "$TAG" dist/install.sh dist/install.sh.sha256 --clobber

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Undrafting is what creates the tag and makes the release visible, so
          # it happens once every asset is attached.
          gh release edit "$TAG" --draft=false

      # npm last, and only after the GitHub release is published: the npm
      # dist-tags are what `install.sh --channel rc` resolves a version from, so
      # publishing them earlier advertises a release whose assets do not exist
      # yet.
      - name: Publish platform packages to npm
        env:
          DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          set -e
          for pkgdir in npm/cli-*/; do
            echo "=== Publishing $(basename "$pkgdir") @ dist-tag $DIST_TAG ==="
            (cd "$pkgdir" && npm publish --access public --tag "$DIST_TAG")
          done

      - name: Publish wrapper package to npm
        env:
          DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          cd npm/cli
          echo "=== Publishing @orq-ai/cli @ dist-tag $DIST_TAG ==="
          npm publish --access public --tag "$DIST_TAG"
