name: Label PR

# Auto-label a PR from its conventional-commit title prefix so GitHub's
# auto-generated release notes (.github/release.yml) categorize it. CI enforces
# the title format, so the label always derives.
#
# The release:* labels below are reserved for this workflow's automation. They
# intentionally remain separate from repository and human-applied labels.
on:
  pull_request_target:
    # No `synchronize`: pushes cannot change the title, only `edited` can.
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned because this runs as `pull_request_target` with a write token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MAP = {
              feat: 'release:features',
              fix: 'release:bug-fixes', perf: 'release:bug-fixes', revert: 'release:bug-fixes',
              docs: 'release:documentation',
              chore: 'release:maintenance', ci: 'release:maintenance', refactor: 'release:maintenance',
              build: 'release:maintenance', test: 'release:maintenance', style: 'release:maintenance',
            };
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const owned = new Set(Object.values(MAP));
            const labelDetails = {
              'release:features': {
                color: '0E8A16',
                description: 'Automated release-notes label for features.',
              },
              'release:bug-fixes': {
                color: 'D73A4A',
                description: 'Automated release-notes label for bug fixes.',
              },
              'release:documentation': {
                color: '0075CA',
                description: 'Automated release-notes label for documentation.',
              },
              'release:maintenance': {
                color: '6F42C1',
                description: 'Automated release-notes label for maintenance.',
              },
            };
            const provisionLabel = async (name) => {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  ...labelDetails[name],
                });
                core.info(`Provisioned release label: ${name}`);
              } catch (error) {
                const errors = error.response?.data?.errors || [];
                const alreadyExists = error.status === 422 && (
                  errors.some((detail) => detail.code === 'already_exists') ||
                  /already exists/i.test(error.message)
                );
                if (!alreadyExists) throw error;
                core.info(`Release label already exists: ${name}`);
              }
            };

            // Fetch current state rather than trusting the event payload, then
            // remove only labels this workflow owns. This also clears stale
            // automation labels when a title becomes invalid or unmapped.
            const current = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              issue,
            );
            const title = context.payload.pull_request.title || '';
            const m = title.match(/^(\w+)(\([^)]*\))?!?:/);
            const label = m && MAP[m[1].toLowerCase()];
            for (const stale of current
              .map((currentLabel) => currentLabel.name)
              .filter((name) => owned.has(name) && name !== label)) {
              await github.rest.issues.removeLabel({ ...issue, name: stale });
              core.info(`Removed stale label: ${stale}`);
            }

            if (!m) {
              core.info(`Title not conventional, no label: "${title}"`);
              return;
            }
            if (!label) {
              core.info(`No mapping for type "${m[1]}"`);
              return;
            }

            await provisionLabel(label);
            if (current.some((currentLabel) => currentLabel.name === label)) {
              core.info(`Release label already applied: ${label}`);
              return;
            }
            await github.rest.issues.addLabels({ ...issue, labels: [label] });
            core.info(`Applied label: ${label}`);
