name: Label PR

# Auto-label a PR from its conventional-commit title prefix so GitHub's
# auto-generated release notes (.github/release.yml) categorize it.
# .github/workflows/pr-title.yml validates the title format independently; this
# workflow makes no assumption that it passed, and leaves a PR with no release:*
# label when the title is unconventional or its type is unmapped.
#
# The release:* labels below are reserved for this workflow's automation. They
# intentionally remain separate from repository and human-applied labels.
on:
  pull_request_target:
    # No `synchronize`: the label is a pure function of the title, so re-running
    # per push is cost with no effect. pr-title.yml keeps it so a required check
    # exists on each new head SHA.
    types: [opened, edited, reopened]

permissions:
  # pull-requests: write covers adding/removing labels on the PR.
  # issues: write is what the repository-level createLabel endpoint needs.
  issues: write
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  # Not cancelled: two API calls are cheap, and a run killed between adding the
  # new label and removing the stale one leaves a PR in two release categories
  # that nothing reconciles.
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned because this runs as `pull_request_target` with a write token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MAP = {
              feat: 'release:features',
              fix: 'release:bug-fixes', perf: 'release:bug-fixes', revert: 'release:bug-fixes',
              docs: 'release:documentation',
              chore: 'release:maintenance', ci: 'release:maintenance', refactor: 'release:maintenance',
              build: 'release:maintenance', test: 'release:maintenance', style: 'release:maintenance',
            };
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const owned = new Set(Object.values(MAP));
            const labelDetails = {
              'release:features': {
                color: '0E8A16',
                description: 'Automated release-notes label for features.',
              },
              'release:bug-fixes': {
                color: 'D73A4A',
                description: 'Automated release-notes label for bug fixes.',
              },
              'release:documentation': {
                color: '0075CA',
                description: 'Automated release-notes label for documentation.',
              },
              'release:maintenance': {
                color: '6F42C1',
                description: 'Automated release-notes label for maintenance.',
              },
            };
            // `addLabels` would create a missing label on its own, but with a
            // colour GitHub picks and no description. Provisioning first is what
            // makes both ours. Looking it up first keeps the common
            // already-exists case a clean 200, so the 422 below is reserved for
            // the genuine race.
            const provisionLabel = async (name) => {
              const repository = { owner: context.repo.owner, repo: context.repo.repo };
              try {
                await github.rest.issues.getLabel({ ...repository, name });
                return;
              } catch (lookupError) {
                if (lookupError.status !== 404) throw lookupError;
              }
              try {
                await github.rest.issues.createLabel({ ...repository, name, ...labelDetails[name] });
                core.info(`Provisioned release label: ${name}`);
              } catch (createError) {
                // Only an already-exists 422 is another run creating it in
                // between. Every other 422 is a malformed labelDetails entry.
                const errors = createError.response?.data?.errors || [];
                if (!errors.some((entry) => entry.code === 'already_exists')) throw createError;
                core.info(`Release label created concurrently: ${name}`);
              }
            };

            const current = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              issue,
            );
            const title = context.payload.pull_request.title || '';
            const m = title.match(/^(\w+)(\([^)]*\))?!?:/);
            // Object.hasOwn, because a bare lookup reads through the prototype:
            // a title like `constructor:` would resolve to a truthy non-label
            // and crash the run before the stale-label cleanup below.
            const type = m && m[1].toLowerCase();
            const label = type && Object.hasOwn(MAP, type) ? MAP[type] : undefined;

            // Add before removing; see AGENTS.md.
            if (label) {
              await provisionLabel(label);
              if (current.some((currentLabel) => currentLabel.name === label)) {
                core.info(`Release label already applied: ${label}`);
              } else {
                await github.rest.issues.addLabels({ ...issue, labels: [label] });
                core.info(`Applied label: ${label}`);
              }
            } else if (!m) {
              core.info(`Title not conventional, no label: "${title}"`);
            } else {
              core.info(`No mapping for type "${m[1]}"`);
            }

            // Unconditional: this is what clears stale automation labels when a
            // title is retitled, becomes invalid, or loses its mapping.
            for (const stale of current
              .map((currentLabel) => currentLabel.name)
              .filter((name) => owned.has(name) && name !== label)) {
              try {
                await github.rest.issues.removeLabel({ ...issue, name: stale });
                core.info(`Removed stale label: ${stale}`);
              } catch (removeError) {
                if (removeError.status !== 404) throw removeError;
                core.info(`Stale label already removed: ${stale}`);
              }
            }
