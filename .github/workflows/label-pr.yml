name: Label PR

# Auto-label a PR from its conventional-commit title prefix so GitHub's
# auto-generated release notes (.github/release.yml) categorize it. The logic
# and its unit tests live in .github/scripts/label-pr.js and label-pr.test.js.
#
# .github/workflows/pr-title.yml validates the title format independently; this
# workflow makes no assumption that it passed, and leaves a PR with no release:*
# label when the title is unconventional or its type is unmapped.
#
# The release:* namespace is reserved for this workflow's automation. Those
# labels intentionally remain separate from repository and human-applied ones.
on:
  pull_request_target:
    # No `synchronize`: the label is a pure function of the title, so re-running
    # per push is cost with no effect. pr-title.yml keeps it so a required check
    # exists on each new head SHA.
    types: [opened, edited, reopened]

permissions:
  # pull-requests: write covers adding/removing labels on the PR.
  # issues: write is what the repository-level createLabel endpoint needs.
  issues: write
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  # Not cancelled: two API calls are cheap, and a run killed between adding the
  # new label and removing the stale one leaves a PR in two release categories
  # that nothing reconciles.
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Both actions SHA-pinned: this runs as `pull_request_target` with a write
      # token.
      #
      # INVARIANT, asserted by .github/scripts/check-release-label-config.js: no
      # `ref:` on this checkout. On pull_request_target the default is the base
      # branch head, so the pull request's own code is never executed by this
      # privileged job. The checkout exists only to read label-pr.js, so it
      # needs no git credentials.
      #
      # Deliberately a full checkout: a `sparse-checkout` pattern is a second
      # copy of the script's path, and one that CI cannot check against the
      # `require()` below. Moving the directory while updating both the workflow
      # and the file would still pass and then fail on every live PR with
      # MODULE_NOT_FOUND. The base tree is trusted and clones in seconds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/label-pr.js');
            await run({ github, context, core });
