name: Release

# A release is cut for any change that reaches a user's binary, not only an API
# schema bump. detect-changes judges each line on what is unreleased since that
# line's last tag, so nothing is lost to a run GitHub cancels or a pipeline that
# dies before tagging, and the pipeline's own commit-back releases nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which release to run"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    concurrency:
      group: release-detect
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.changes.outputs.stable }}
      prerelease: ${{ steps.changes.outputs.prerelease }}
      stable_version: ${{ steps.changes.outputs.stable_version }}
      stable_api_version: ${{ steps.changes.outputs.stable_api_version }}
      rc_version: ${{ steps.changes.outputs.rc_version }}
      rc_api_version: ${{ steps.changes.outputs.rc_api_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the ranges below run from each release
          # line's last tag, and a missing tag would read as "nothing released
          # yet" and release everything.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # Judged on what is unreleased on each line, not on this push. Anchored
          # on VERSION rather than the highest tag, so the orq API's old
          # v4.12.x-v4.14.x numbering is never mistaken for this line's last
          # release. No tag yet means the line has not started.
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_exists() { git rev-parse -q --verify "refs/tags/$1" >/dev/null; }
          stable_tag=""
          if tag_exists "v$file_version"; then stable_tag="v$file_version"; fi

          stable_api_version="$(jq -r '.app_version' .bartolo.json)"
          rc_api_version="$(jq -r '.app_version' packages/orq-rc/.bartolo.json)"
          released_api=""
          if [ -n "$stable_tag" ]; then
            # A tag whose tree has no .bartolo.json reads as no previous API version.
            released_api="$(git show "$stable_tag:.bartolo.json" 2>/dev/null | jq -r '.app_version' || true)"
          fi
          tags_file="$(mktemp)"; commits_file="$(mktemp)"
          git tag --list 'v*' > "$tags_file"
          # NUL between records, subject on each record's first line: the
          # resolver honours `type!:` on the subject only, so a wrapped body
          # line cannot cut a major.
          git log --full-history -z --format='%s%n%b' "${stable_tag:+$stable_tag..}HEAD" -- \
            VERSION cli/custom npm scripts install.sh \
            openapi.yaml .bartolo.json go.mod go.sum cmd/orq cmd/release-version > "$commits_file"
          stable_resolved="$(go run ./cmd/release-version \
            --channel stable --version "$file_version" \
            --api-version "$stable_api_version" --released-api-version "$released_api" \
            --tags-file "$tags_file" --commits-file "$commits_file")"
          stable_version="$(printf '%s\n' "$stable_resolved" | awk -F= '$1 == "version" { print $2 }')"
          # The rc anchor walks the commit graph: rc numbers do not only move
          # forward, so the highest-sorting rc tag is not always the one that
          # shipped last. `|| true` covers describe's exit 128 when no rc tag is
          # reachable, which reads as "the line has not started".
          rc_tag="$(git describe --tags --match 'v*-rc.*' --abbrev=0 HEAD || true)"
          # No tag on a line yet: everything it ships counts as unreleased.
          changed_since() {
            if [ -n "$1" ]; then git diff --name-only "$1" HEAD; else git ls-files; fi
          }
          # Test files change no shipped byte, so they cannot be what makes a
          # release worth cutting. The git call runs unguarded so a failure
          # stops the job; `|| true` covers only grep's exit 1 on no matches.
          all_stable="$(changed_since "$stable_tag")"
          all_rc="$(changed_since "$rc_tag")"
          CHANGED_STABLE="$(printf '%s\n' "$all_stable" | grep -v '_test\.go$' || true)"
          CHANGED_RC="$(printf '%s\n' "$all_rc" | grep -v '_test\.go$' || true)"
          echo "unreleased since ${stable_tag:-the beginning} (stable) / ${rc_tag:-the beginning} (rc)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$TARGET" in
              stable)     stable=true;  prerelease=false ;;
              prerelease) stable=false; prerelease=true  ;;
              both)       stable=true;  prerelease=true  ;;
            esac
          else
            # Shared: compiled into both binaries, or shipped by both
            # releases. Each module's own cmd/ is not, and cmd/surface-dump
            # ships to nobody. cmd/release-version ships to nobody either, but
            # it decides what both channels publish - leaving it out is how a
            # fix to it waits for an unrelated commit to take effect.
            SHARED='^(VERSION$|cli/custom/|npm/|scripts/|install\.sh$|cmd/release-version/)'

            stable=false
            prerelease=false
            if grep -qE "^(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/orq/)|$SHARED" <<< "$CHANGED_STABLE"; then
              stable=true
            fi
            if grep -qE "^packages/orq-rc/(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/)|$SHARED" <<< "$CHANGED_RC"; then
              prerelease=true
            fi
          fi

          # The rc is resolved last, against the tag the stable run is about to
          # cut, so it previews the release after that one rather than the one
          # already being published. Resolving both from the same tag set is how
          # a `both` run ended up with 5.2.0 and 5.2.0-rc.1 racing for the same
          # base, one of which then failed its own floor check.
          if [ "$stable" = "true" ]; then echo "v$stable_version" >> "$tags_file"; fi
          rc_resolved="$(go run ./cmd/release-version \
            --channel rc --version "$file_version" \
            --api-version "$rc_api_version" --released-api-version "$released_api" \
            --tags-file "$tags_file" --commits-file "$commits_file")"
          rc_version="$(printf '%s\n' "$rc_resolved" | awk -F= '$1 == "version" { print $2 }')"

          {
            echo "stable=$stable"
            echo "prerelease=$prerelease"
            echo "stable_version=$stable_version"
            echo "stable_api_version=$stable_api_version"
            echo "rc_version=$rc_version"
            echo "rc_api_version=$rc_api_version"
          } >> "$GITHUB_OUTPUT"

  release-stable:
    needs: detect-changes
    if: needs.detect-changes.outputs.stable == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Stable
    permissions:
      contents: write
      id-token: write
    with:
      version: ${{ needs.detect-changes.outputs.stable_version }}
      api_version: ${{ needs.detect-changes.outputs.stable_api_version }}

  release-prerelease:
    needs: detect-changes
    if: needs.detect-changes.outputs.prerelease == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Pre-release
    permissions:
      contents: write
      id-token: write
    with:
      module_dir: packages/orq-rc
      version: ${{ needs.detect-changes.outputs.rc_version }}
      api_version: ${{ needs.detect-changes.outputs.rc_api_version }}
