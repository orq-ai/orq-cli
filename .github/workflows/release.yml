name: Release

# A release is cut for any change that reaches a user's binary — hand-written
# CLI code and the installer included, not only an API schema bump. Before
# this, a CLI-only fix sat on main until orquesta-web happened to publish a
# schema, because that push was the only release trigger.
#
# The paths deliberately exclude everything the release pipeline itself writes
# back to main (cli/generated, examples, README.md, go.mod, go.sum,
# surface.json, VERSION), so a release cannot trigger the next one.
on:
  push:
    branches: [main]
    paths:
      - openapi.yaml
      - .bartolo.json
      - cli/custom/**
      - cmd/**
      - npm/**
      - scripts/**
      - install.sh
      - packages/orq-rc/openapi.yaml
      - packages/orq-rc/.bartolo.json
      - packages/orq-rc/cmd/**
  workflow_dispatch:
    inputs:
      target:
        description: "Which release to run"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.changes.outputs.stable }}
      prerelease: ${{ steps.changes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger - use input
            case "$TARGET" in
              stable)
                echo "stable=true" >> "$GITHUB_OUTPUT"
                echo "prerelease=false" >> "$GITHUB_OUTPUT"
                ;;
              prerelease)
                echo "stable=false" >> "$GITHUB_OUTPUT"
                echo "prerelease=true" >> "$GITHUB_OUTPUT"
                ;;
              both)
                echo "stable=true" >> "$GITHUB_OUTPUT"
                echo "prerelease=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            # Push event - detect from changed files
            CHANGED=$(git diff --name-only HEAD~1 HEAD)

            # Shared paths (cli/custom, scripts, npm, install.sh) go into both
            # binaries — packages/orq-rc builds the same hand-written commands
            # against the staging schema — so they release both lines.
            SHARED='^(cli/custom/|cmd/|npm/|scripts/|install\.sh$)'

            if echo "$CHANGED" | grep -qE "^(openapi\.yaml|\.bartolo\.json)$|$SHARED"; then
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi

            if echo "$CHANGED" | grep -qE "^packages/orq-rc/(openapi\.yaml|\.bartolo\.json|cmd/)|$SHARED"; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release-stable:
    needs: detect-changes
    if: needs.detect-changes.outputs.stable == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Stable
    permissions:
      contents: write
      id-token: write
    with:
      npm_dist_tag: latest

  release-prerelease:
    needs: detect-changes
    if: needs.detect-changes.outputs.prerelease == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Pre-release
    permissions:
      contents: write
      id-token: write
    with:
      module_dir: packages/orq-rc
      npm_dist_tag: rc
