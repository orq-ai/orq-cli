name: Release

# A release is cut for any change that reaches a user's binary, not only an API
# schema bump. detect-changes judges each line on what is unreleased since that
# line's last tag, so nothing is lost to a run GitHub cancels or a pipeline that
# dies before tagging, and the pipeline's own commit-back releases nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which release to run"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.changes.outputs.stable }}
      prerelease: ${{ steps.changes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history and tags: the ranges below run from each release
          # line's last tag, and a missing tag would read as "nothing released
          # yet" and release everything.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # Judged on what is unreleased on each line, not on this push: GitHub
          # cancels the older waiting run per concurrency group, and a
          # push-scoped range would die with it. Anchored on VERSION rather than
          # the highest tag, so the orq API's old v4.12.x-v4.14.x numbering is
          # never mistaken for this line's last release. No tag yet means the
          # line has not started.
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_exists() { git rev-parse -q --verify "refs/tags/$1" >/dev/null; }
          stable_tag=""
          if tag_exists "v$file_version"; then stable_tag="v$file_version"; fi

          api_now="$(jq -r '.app_version' .bartolo.json)"
          api_released=""
          if [ -n "$stable_tag" ]; then
            api_released="$(git show "$stable_tag:.bartolo.json" | jq -r '.app_version')"
          fi

          commits="$(git log --full-history --format='%s%n%b' "${stable_tag:+$stable_tag..}HEAD" -- \
            VERSION cli/custom npm scripts install.sh \
            openapi.yaml .bartolo.json go.mod go.sum cmd/orq)"
          tags_file="$(mktemp)"; commits_file="$(mktemp)"
          git tag --list 'v*' > "$tags_file"
          rc_commits_file="$(mktemp)"
          rc_resolved="$(go run ./cmd/release-version \
            --channel rc --version "$file_version" \
            --api-version "$api_now" --released-api-version "$api_released" \
            --tags-file "$tags_file" --commits-file "$rc_commits_file")"
          rc_tag="$(printf '%s\n' "$rc_resolved" | awk -F= '$1 == "previous_tag" { print $2 }')"
          # No tag on a line yet: everything it ships counts as unreleased.
          changed_since() {
            if [ -n "$1" ]; then git diff --name-only "$1" HEAD; else git ls-files; fi
          }
          # Test files change no shipped byte, so they cannot be what makes a
          # release worth cutting. The git call runs unguarded so a failure
          # stops the job; `|| true` covers only grep's exit 1 on no matches.
          all_stable="$(changed_since "$stable_tag")"
          all_rc="$(changed_since "$rc_tag")"
          CHANGED_STABLE="$(printf '%s\n' "$all_stable" | grep -v '_test\.go$' || true)"
          CHANGED_RC="$(printf '%s\n' "$all_rc" | grep -v '_test\.go$' || true)"
          printf '%s\n' "$commits" > "$commits_file"
          resolved="$(go run ./cmd/release-version \
            --channel stable --version "$file_version" \
            --api-version "$api_now" --released-api-version "$api_released" \
            --tags-file "$tags_file" --commits-file "$commits_file")"
          bump="$(printf '%s\n' "$resolved" | awk -F= '$1 == "bump" { print $2 }')"
          echo "unreleased since ${stable_tag:-the beginning} (stable) / ${rc_tag:-the beginning} (rc); resolved bump=$bump"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$TARGET" in
              stable)     stable=true;  prerelease=false ;;
              prerelease) stable=false; prerelease=true  ;;
              both)       stable=true;  prerelease=true  ;;
            esac
          else
            # Shared: compiled into both binaries, or shipped by both
            # releases. Each module's own cmd/ is not, and cmd/surface-dump
            # ships to nobody.
            SHARED='^(VERSION$|cli/custom/|npm/|scripts/|install\.sh$)'

            stable=false
            prerelease=false
            if grep -qE "^(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/orq/)|$SHARED" <<< "$CHANGED_STABLE"; then
              stable=true
            fi
            if grep -qE "^packages/orq-rc/(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/)|$SHARED" <<< "$CHANGED_RC"; then
              prerelease=true
            fi
          fi

          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release-stable:
    needs: detect-changes
    if: needs.detect-changes.outputs.stable == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Stable
    permissions:
      contents: write
      id-token: write

  release-prerelease:
    needs: detect-changes
    if: needs.detect-changes.outputs.prerelease == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Pre-release
    permissions:
      contents: write
      id-token: write
    with:
      module_dir: packages/orq-rc
