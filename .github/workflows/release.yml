name: Release

# A release is cut for any change that reaches a user's binary — hand-written
# CLI code and the installer included, not only an API schema bump. Before
# this, a CLI-only fix sat on main until orquesta-web happened to publish a
# schema, because that push was the only release trigger.
#
# detect-changes judges each release line on everything since that line's last
# tag rather than on the contents of the triggering push, so a release cannot be
# lost by a run that GitHub cancels, by a pipeline that dies before tagging, or
# by a push whose own diff looks innocent. That is also why there is no `paths:`
# filter and no bot-author guard: the pipeline's commit-back is the commit the
# tag points at, so the range behind it is empty and it releases nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which release to run"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.changes.outputs.stable }}
      prerelease: ${{ steps.changes.outputs.prerelease }}
      bump: ${{ steps.changes.outputs.bump }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history and tags: the ranges below run from each release
          # line's last tag, and a missing tag would read as "nothing released
          # yet" and release everything.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # Judged on what is UNRELEASED on each line - everything since that
          # line's last tag - not on what this one push contained. GitHub keeps
          # at most one run waiting per concurrency group and cancels the older
          # one when a newer arrives, so a push-scoped run that loses its slot
          # would take its commits' release with it. Measured from the last tag,
          # the next run to survive picks up everything that has not shipped,
          # whatever happened to the runs before it.
          #
          # It also means the pipeline's own commit-back cannot trigger a
          # release: the tag is created AT that commit, so the range behind it
          # is empty. And a release that died before tagging is retried by the
          # next push instead of being lost.
          # Anchored on VERSION rather than on the highest tag in the repo:
          # VERSION is what the pipeline wrote at the last release, so v$VERSION
          # is this line's last tag by construction, and the v4.12.x-v4.14.x
          # tags of the orq API's old numbering are never mistaken for it. No
          # tag yet means the line has not started and everything is unreleased.
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_exists() { git rev-parse -q --verify "refs/tags/$1" >/dev/null; }
          stable_tag=""
          if tag_exists "v$file_version"; then stable_tag="v$file_version"; fi

          # The rc line runs ahead of stable at <next-minor>.0-rc.<n>, so its
          # last tag is the highest rc of that minor, or the stable release it
          # branched from if none has been cut yet.
          # `|| true`: with pipefail set, an empty tag list makes head SIGPIPE
          # git, and "no rc yet" is a valid answer.
          rc_major="${file_version%%.*}"; rc_rest="${file_version#*.}"
          rc_next="$rc_major.$((${rc_rest%%.*} + 1)).0"
          rc_tag="$(git tag --list "v$rc_next-rc.*" --sort=-v:refname | head -n 1 || true)"
          if [ -z "$rc_tag" ]; then rc_tag="$stable_tag"; fi

          # No tag on a line yet: everything it ships counts as unreleased.
          changed_since() {
            if [ -n "$1" ]; then git diff --name-only "$1" HEAD; else git ls-files; fi
          }
          # Test files change no shipped byte, so they cannot be what makes a
          # release worth cutting.
          CHANGED_STABLE="$(changed_since "$stable_tag" | grep -v '_test\.go$' || true)"
          CHANGED_RC="$(changed_since "$rc_tag" | grep -v '_test\.go$' || true)"

          # The stable release moves the same field the orq API moved: their
          # major is our major, their minor our minor. The CLI has its own
          # number, but the API is the contract our commands are generated
          # from, so the size of their change is the size of ours.
          #
          # Compared value-to-value rather than by file: a schema republished at
          # the same app_version is not a new API. What this repo does to itself
          # is read from the commit types below, not from this comparison.
          field() { v="${1#*.}"; case "$2" in 1) printf '%s' "${1%%.*}" ;; 2) printf '%s' "${v%%.*}" ;; esac; }
          bump=patch
          # Same validation the pipeline does: jq prints "null" for a missing
          # key, and "null" != "4.13.22" would read as an API change and cut a
          # release off a broken schema file.
          api_now="$(jq -r '.app_version' .bartolo.json)"
          if [ -z "$api_now" ] || [ "$api_now" = "null" ]; then
            echo "error: app_version missing in .bartolo.json" >&2
            exit 1
          fi
          api_released=""
          if [ -n "$stable_tag" ]; then
            api_released="$(git show "$stable_tag:.bartolo.json" | jq -r '.app_version')"
            if [ "$api_released" = "null" ]; then api_released=""; fi
          fi
          if [ -n "$api_released" ] && [ "$api_released" != "$api_now" ]; then
            if [ "$(field "$api_now" 1)" != "$(field "$api_released" 1)" ]; then
              bump=major
            elif [ "$(field "$api_now" 2)" != "$(field "$api_released" 2)" ]; then
              bump=minor
            fi
          fi

          # ...and our own changes speak through their conventional-commit type,
          # so nobody edits VERSION for an ordinary feature: `feat:` earns a
          # minor, a `!` or a BREAKING CHANGE footer a major, everything else a
          # patch. The two sources are combined by taking the larger - an orq
          # patch release carrying a `feat:` of ours is still a minor.
          #
          # Here-strings, not `printf | grep -q`: grep -q exits at the first
          # match and closes the pipe, printf dies of SIGPIPE, and pipefail
          # reads that 141 as "no match" - silently, and only once the input
          # outgrows the pipe buffer.
          #
          # Scoped to the paths the stable binary is built from, the same way
          # CHANGED_STABLE is: an rc-only `feat:` ships to nobody on this line,
          # so it must not decide this line's version. --full-history keeps
          # merge commits that touch those paths, whose subject is where a
          # squash-merged `feat:` usually lives.
          commits="$(git log --full-history --format='%s%n%b' "${stable_tag:+$stable_tag..}HEAD" -- \
            VERSION cli/custom npm scripts install.sh \
            openapi.yaml .bartolo.json go.mod go.sum cmd/orq)"
          commit_bump=patch
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "$commits"; then
            commit_bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$commits"; then
            commit_bump=minor
          fi
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; *) echo 1 ;; esac; }
          api_bump="$bump"
          if [ "$(rank "$commit_bump")" -gt "$(rank "$bump")" ]; then
            bump="$commit_bump"
          fi
          if [ "$bump" = major ]; then
            echo "::warning::Releasing a MAJOR (orq API says $api_bump, commits say $commit_bump). A breaking change of ours needs a deliberate \`!\` or BREAKING CHANGE footer - if that was not deliberate, fix the commit before this reaches main."
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "unreleased since ${stable_tag:-the beginning} (stable) / ${rc_tag:-the beginning} (rc); orq API ${api_released:-none} -> $api_now (api=$api_bump, commits=$commit_bump), bump=$bump"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$TARGET" in
              stable)     stable=true;  prerelease=false ;;
              prerelease) stable=false; prerelease=true  ;;
              both)       stable=true;  prerelease=true  ;;
            esac
          else
            # Shared: built into both binaries (packages/orq-rc compiles the
            # root's hand-written commands against the staging schema), or
            # shared by both releases. Each module's own cmd/ is NOT shared,
            # and cmd/surface-dump ships to nobody.
            SHARED='^(VERSION$|cli/custom/|npm/|scripts/|install\.sh$)'

            stable=false
            prerelease=false
            if grep -qE "^(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/orq/)|$SHARED" <<< "$CHANGED_STABLE"; then
              stable=true
            fi
            if grep -qE "^packages/orq-rc/(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/)|$SHARED" <<< "$CHANGED_RC"; then
              prerelease=true
            fi
          fi

          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release-stable:
    needs: detect-changes
    if: needs.detect-changes.outputs.stable == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Stable
    permissions:
      contents: write
      id-token: write
    with:
      npm_dist_tag: latest
      bump: ${{ needs.detect-changes.outputs.bump }}

  release-prerelease:
    needs: detect-changes
    if: needs.detect-changes.outputs.prerelease == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Pre-release
    permissions:
      contents: write
      id-token: write
    with:
      module_dir: packages/orq-rc
      npm_dist_tag: rc
