name: Release

# A release is cut for any change that reaches a user's binary — hand-written
# CLI code and the installer included, not only an API schema bump. Before
# this, a CLI-only fix sat on main until orquesta-web happened to publish a
# schema, because that push was the only release trigger.
#
# There is deliberately no `paths:` filter: detect-changes below already decides
# what ships, per release line, and a second copy of that list in the trigger
# would be one more thing to keep in sync — silently dropping releases when it
# drifted.
#
# A release cannot trigger the next one: the pipeline's commit-back is made with
# GITHUB_TOKEN, and GitHub does not start workflow runs for those. The
# bot-authored guard in detect-changes is the second line of defence, for the
# day someone swaps that credential for a PAT.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which release to run"
        required: true
        type: choice
        options:
          - stable
          - prerelease
          - both

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.changes.outputs.stable }}
      prerelease: ${{ steps.changes.outputs.prerelease }}
      bump: ${{ steps.changes.outputs.bump }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 0, not 2: the range below spans the whole push, which can be more
          # than one commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger - use input
            case "$TARGET" in
              stable)
                echo "stable=true" >> "$GITHUB_OUTPUT"
                echo "prerelease=false" >> "$GITHUB_OUTPUT"
                ;;
              prerelease)
                echo "stable=false" >> "$GITHUB_OUTPUT"
                echo "prerelease=true" >> "$GITHUB_OUTPUT"
                ;;
              both)
                echo "stable=true" >> "$GITHUB_OUTPUT"
                echo "prerelease=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            # Push event - detect from changed files.
            #
            # The whole push range, not HEAD~1..HEAD: a merge that lands four
            # commits would otherwise be judged on the last one alone, and a
            # CLI fix in an earlier commit would go unreleased - the exact
            # failure this workflow exists to prevent.
            #
            # `before` is all-zeros on a branch's first push, and points at a
            # commit that no longer exists after a force-push; in both cases the
            # parent of the tip is the only range there is.
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              START="$BEFORE"
            elif START="$(git rev-parse -q --verify "$AFTER^")"; then
              echo "note: $BEFORE is not reachable, judging the tip commit alone" >&2
            else
              # No range at all: release both rather than skip, because a missed
              # release is the failure this workflow exists to prevent.
              echo "stable=true" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The release pipeline commits its regenerated code and version
            # bump back to main. Releasing that commit would release the
            # release, forever. Matched on github-actions[bot], the identity
            # the Git Data API attributes a GITHUB_TOKEN commit to - NOT on
            # admin@orq.ai, which is also orquesta-web's schema-publish commit
            # and must keep triggering releases. Judged over the whole range,
            # like the file list: a human commit anywhere in the push must still
            # release. A git failure here aborts rather than releasing blind.
            if ! AUTHORS="$(git log --format=%an "$START..$AFTER")"; then
              echo "error: cannot read commit authors for $START..$AFTER" >&2
              exit 1
            fi
            if ! printf '%s\n' "$AUTHORS" | grep -qvx 'github-actions\[bot\]'; then
              echo "push is the release pipeline's own commit-back; nothing to release"
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Test files are excluded: they change no shipped byte, and cutting
            # a release for one publishes an identical binary under a new
            # number.
            CHANGED="$(git diff --name-only "$START" "$AFTER" | grep -v '_test\.go$' || true)"

            # Shared: built into both binaries (packages/orq-rc compiles the
            # root's hand-written commands against the staging schema), or
            # shared by both releases. Each module's own cmd/ is NOT shared,
            # and cmd/surface-dump ships to nobody.
            SHARED='^(VERSION$|cli/custom/|npm/|scripts/|install\.sh$)'

            # Which field of the version the stable release moves. A new orq
            # API schema is the only change that can alter what the commands
            # are, so it takes the minor; everything else - a CLI fix, an
            # installer change - takes the patch, which the pipeline assumes
            # when this output is unset. A manual run has no push range to
            # judge, so it lands on patch as well.
            if echo "$CHANGED" | grep -qE '^(openapi\.yaml|\.bartolo\.json)$'; then
              echo "bump=minor" >> "$GITHUB_OUTPUT"
            fi

            if echo "$CHANGED" | grep -qE "^(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/orq/)|$SHARED"; then
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi

            if echo "$CHANGED" | grep -qE "^packages/orq-rc/(openapi\.yaml|\.bartolo\.json|go\.mod|go\.sum|cmd/)|$SHARED"; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release-stable:
    needs: detect-changes
    if: needs.detect-changes.outputs.stable == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Stable
    permissions:
      contents: write
      id-token: write
    with:
      npm_dist_tag: latest
      bump: ${{ needs.detect-changes.outputs.bump }}

  release-prerelease:
    needs: detect-changes
    if: needs.detect-changes.outputs.prerelease == 'true'
    uses: ./.github/workflows/release-pipeline.yml
    name: Pre-release
    permissions:
      contents: write
      id-token: write
    with:
      module_dir: packages/orq-rc
      npm_dist_tag: rc
