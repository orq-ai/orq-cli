name: CI

# Build + test gate, and the command-surface stability gate (RES-1133).
#
# The surface gate is the important one: ~95% of the command tree is
# regenerated from openapi.yaml, so a renamed API field or endpoint changes
# commands and flags with nothing forcing a human to look. surface.json is the
# committed contract; this workflow regenerates it and fails on any mismatch,
# which turns every surface change into a reviewable diff. See CHANGELOG.md
# for the stability contract (what users may depend on).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Separate from `stable`: neither step needs Go, and a workflow-only PR
  # should not have to wait for the Go build to learn its workflows are broken.
  workflows:
    name: workflow and release-label validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: release-label configuration
        run: node .github/scripts/check-release-label-config.js
      - name: label-pr unit tests
        # Explicit file: `node --test <dir>` requires the directory as one
        # module rather than scanning it, and a glob that matches nothing exits
        # 0. A missing file here exits 1, which is what a rename should do.
        run: node --test .github/scripts/label-pr.test.js
      - name: actionlint
        env:
          # Bump both together: ACTIONLINT_SHA256 is the sha256 of
          # actionlint_<version>_linux_amd64.tar.gz, taken from the release's
          # published checksums.txt. Changing only the version fails the
          # checksum step below.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --show-error --silent \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # No --status: on a mismatch the only useful signal is the FAILED line
          # it prints, and this step is otherwise silent.
          if ! printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check; then
            echo "actionlint ${ACTIONLINT_VERSION} checksum mismatch: expected ${ACTIONLINT_SHA256}." >&2
            echo "Bump ACTIONLINT_SHA256 from the release's checksums.txt, or treat this as a tampered download." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          # ShellCheck runs too, on the `run:` blocks in these workflows only —
          # it is the runner's copy rather than a pinned one, so a runner
          # upgrade can surface new warnings. install.sh and scripts/*.sh are
          # not linted here; they carry their own shellcheck disable directives
          # for whoever adds that step.
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml

  stable:
    name: build, vet, test, surface (stable module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          set -euo pipefail
          # xargs runs its command once even on empty input, and gofmt with no
          # file arguments reads stdin and exits 0 — so an empty list would
          # report success without having examined anything. Fail on it instead.
          if [ "$(git ls-files '*.go' | wc -l)" -eq 0 ]; then
            echo "no Go files found; the pathspec or the tree is wrong"; exit 1
          fi
          # -z/-0 rather than a shell variable: command substitution drops NUL
          # bytes, so capturing the list first would splice two names together.
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: command surface matches surface.json
        run: go run ./cmd/surface-dump -check

  windows:
    name: skills on windows
    # cli/custom/skills has a Windows-only half — LockFileEx in flock_windows.go,
    # copies instead of symlinks, and the .orq-owned marker that stands in for
    # resolving one. None of it is compiled by the Linux job, so before this
    # existed the first Windows user was the first execution. Only the skills
    # package runs here: it is the part with an OS-specific implementation, and
    # the rest of the CLI is covered by the stable job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./cli/custom/skills/

  installer:
    name: install.sh runs under dash
    # ubuntu-latest: dash is preinstalled there; the macOS release runner has none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: parse under dash
        run: dash -n install.sh
      - name: install with no controlling terminal
        # setsid = no controlling terminal (the CI/Docker/ssh case), which fails only at runtime.
        # A full install, not --help: --help returns before the first have_tty call.
        # SHELL makes the PATH branch resolve a profile; HOME keeps the runner's own dotfiles out of it.
        run: |
          export HOME="$RUNNER_TEMP/installer-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh \
            --no-setup --install-dir "$HOME/orq" < /dev/null
          test -x "$HOME/orq/orq"
      - name: upgrade over an existing install
        # The first job installs into a fresh dir, so `previous` stays empty and
        # the whole upgrade/rollback block never runs. This one exercises it.
        run: |
          export HOME="$RUNNER_TEMP/upgrade-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh --no-setup --install-dir "$HOME/orq" < /dev/null
          SHELL=/bin/bash setsid dash install.sh --no-setup --install-dir "$HOME/orq" < /dev/null
          test -x "$HOME/orq/orq"
          test ! -e "$HOME/orq/orq.previous"   # cleaned up once the new binary proved it runs
      - name: a failed download leaves the existing install alone
        # Fails at the download, before the upgrade block, so this covers the
        # early-exit path only. The rollback block itself (probe fails, previous
        # restored) still has no CI fixture — it needs a release that downloads
        # and does not run.
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/rollback-home"
          mkdir -p "$HOME/orq"
          printf '#!/bin/sh\necho "orq version 0.0.0-sentinel"\n' > "$HOME/orq/orq"
          chmod +x "$HOME/orq/orq"
          if SHELL=/bin/bash setsid dash install.sh --no-setup \
               --install-dir "$HOME/orq" --version v0.0.0-does-not-exist < /dev/null; then
            echo "installer exited 0 on a release that does not exist" >&2
            exit 1
          fi
          "$HOME/orq/orq" --version | grep -q 0.0.0-sentinel
      - name: reject non-ASCII in output
        # Covers only the static --help text; an ungated glyph in the install flow itself would still pass.
        run: |
          set -eu
          out=$(LC_ALL=C LANG=C dash install.sh --help)
          if printf '%s' "$out" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
            echo "--help emits non-ASCII under a C locale:" >&2
            printf '%s' "$out" | LC_ALL=C grep -nP '[^\x00-\x7F]' >&2
            exit 1
          fi

  rc:
    name: build, vet (orq-rc module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orq-rc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/orq-rc/go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
