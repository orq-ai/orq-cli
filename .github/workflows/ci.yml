name: CI

# Build + test gate, and the command-surface stability gate (RES-1133).
#
# The surface gate is the important one: ~95% of the command tree is
# regenerated from openapi.yaml, so a renamed API field or endpoint changes
# commands and flags with nothing forcing a human to look. surface.json is the
# committed contract; this workflow regenerates it and fails on any mismatch,
# which turns every surface change into a reviewable diff. See CHANGELOG.md
# for the stability contract (what users may depend on).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable:
    name: build, vet, test, surface (stable module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: command surface matches surface.json
        run: go run ./cmd/surface-dump -check

  installer:
    name: install.sh runs under dash
    # ubuntu-latest, because /bin/sh here is dash. The release job runs on
    # macOS, where /bin/sh is bash in posix mode and accepts constructs dash
    # rejects — a parse check there passes on scripts that die on Debian.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse under dash
        run: dash -n install.sh
      - name: install with no controlling terminal
        # setsid detaches the controlling terminal, which is the CI/Docker/ssh
        # case: a POSIX special built-in failing a redirection exits the shell
        # outright there, and only at runtime — parsing cannot see it.
        #
        # A full install, not --help: --help returns before the first have_tty
        # call, so it exits 0 on a script carrying exactly the bug this job
        # exists to catch. Verified by reverting the fix — --help passes,
        # this fails with the silent exit 2.
        #
        # SHELL is set so the PATH branch resolves a profile and runs; HOME is
        # redirected so the runner's own dotfiles are left alone.
        run: |
          export HOME="$RUNNER_TEMP/installer-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh \
            --no-setup --install-dir "$HOME/orq" < /dev/null
          test -x "$HOME/orq/orq"
      - name: reject non-ASCII in output
        # The UTF-8 fallback only holds if every glyph is gated; a stray one
        # renders as mojibake on a non-UTF-8 terminal.
        run: |
          set -eu
          out=$(LC_ALL=C LANG=C dash install.sh --help)
          if printf '%s' "$out" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
            echo "--help emits non-ASCII under a C locale:" >&2
            printf '%s' "$out" | LC_ALL=C grep -nP '[^\x00-\x7F]' >&2
            exit 1
          fi

  rc:
    name: build, vet (orq-rc module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orq-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/orq-rc/go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
