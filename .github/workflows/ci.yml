name: CI

# Build + test gate, and the command-surface stability gate (RES-1133).
#
# The surface gate is the important one: ~95% of the command tree is
# regenerated from openapi.yaml, so a renamed API field or endpoint changes
# commands and flags with nothing forcing a human to look. surface.json is the
# committed contract; this workflow regenerates it and fails on any mismatch,
# which turns every surface change into a reviewable diff. See CHANGELOG.md
# for the stability contract (what users may depend on).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable:
    name: build, vet, test, surface (stable module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: command surface matches surface.json
        run: go run ./cmd/surface-dump -check
      - name: changelog stamping
        run: python3 scripts/stamp-changelog.py --self-test
      - name: stamp-only release packages stay aligned
        run: |
          set -euo pipefail
          version="5.0.0"
          api_version="4.13.22"

          for pkgdir in npm/cli-*/; do
            package="${pkgdir%/}"
            target="${package##*/}"
            suffix="${target#cli-}"
            executable="orq"
            if [ "$suffix" = "win32-x64" ]; then
              executable="orq.exe"
            fi
            mkdir -p "$pkgdir/bin"
            printf 'fake' > "$pkgdir/bin/$executable"
          done

          ./scripts/release-build.sh --stamp-only "$version" "$api_version"

          VERSION="$version" API_VERSION="$api_version" node <<'NODE'
          const fs = require("node:fs");
          const dirs = [
            "npm/cli",
            "npm/cli-darwin-arm64",
            "npm/cli-darwin-x64",
            "npm/cli-linux-x64",
            "npm/cli-linux-arm64",
            "npm/cli-win32-x64",
          ];
          const version = process.env.VERSION;
          const apiVersion = process.env.API_VERSION;
          const packages = dirs.map((dir) => ({
            dir,
            package: JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8")),
          }));

          for (const { dir, package: pkg } of packages) {
            if (pkg.version !== version || pkg.orqApiVersion !== apiVersion) {
              throw new Error(`${dir} has the wrong version metadata`);
            }
          }

          const wrapper = packages[0].package;
          const expectedDependencies = dirs.slice(1).map((dir) => {
            const suffix = dir.slice("npm/cli-".length);
            return `@orq-ai/cli-${suffix}`;
          });
          for (const name of expectedDependencies) {
            if (wrapper.optionalDependencies[name] !== version) {
              throw new Error(`${name} is not pinned to ${version}`);
            }
          }
          for (const [name, dependencyVersion] of Object.entries(wrapper.optionalDependencies)) {
            if (!name.startsWith("@orq-ai/cli-") || dependencyVersion !== version) {
              throw new Error(`${name} is not pinned to ${version}`);
            }
          }
          NODE

          missing="npm/cli-linux-arm64/bin/orq"
          rm "$missing"
          if ./scripts/release-build.sh --stamp-only "$version" "$api_version"; then
            echo "stamp-only succeeded without $missing" >&2
            exit 1
          fi

  windows:
    name: skills on windows
    # cli/custom/skills has a Windows-only half — LockFileEx in flock_windows.go,
    # copies instead of symlinks, and the .orq-owned marker that stands in for
    # resolving one. None of it is compiled by the Linux job, so before this
    # existed the first Windows user was the first execution. Only the skills
    # package runs here: it is the part with an OS-specific implementation, and
    # the rest of the CLI is covered by the stable job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./cli/custom/skills/

  installer:
    name: install.sh runs under dash
    # ubuntu-latest: dash is preinstalled there; the macOS release runner has none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse under dash
        run: dash -n install.sh
      - name: test rc resolver fixtures under dash
        run: |
          dash <<'SH'
          set -eu
          ORQ_CLI_LIB_ONLY=1 . ./install.sh

          assert_fixture() {
            input="$1"
            expected="$2"
            actual="$(printf '%s' "$input" | rc_version_from_dist_tags)"
            printf 'input: %s\n' "$input"
            printf 'output: %s\n' "${actual:-<empty>}"
            if [ "$actual" != "$expected" ]; then
              printf 'expected: %s\n' "${expected:-<empty>}" >&2
              exit 1
            fi
          }

          assert_fixture '{"latest":"4.14.3","rc":"5.1.0-rc.1"}' 'v5.1.0-rc.1'
          assert_fixture '{"stable":"rc","rc":"5.1.0-rc.1"}' 'v5.1.0-rc.1'
          assert_fixture '{"latest":"4.14.3"}' ''
          assert_fixture '' ''
          SH
      - name: install with no controlling terminal
        # setsid = no controlling terminal (the CI/Docker/ssh case), which fails only at runtime.
        # A full install, not --help: --help returns before the first have_tty call.
        # SHELL makes the PATH branch resolve a profile; HOME keeps the runner's own dotfiles out of it.
        run: |
          export HOME="$RUNNER_TEMP/installer-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh \
            --no-setup --install-dir "$HOME/orq" < /dev/null
          test -x "$HOME/orq/orq"
      - name: install the rc channel
        if: github.event_name == 'push'
        # The rc line is a GitHub pre-release, which /releases/latest never
        # returns, so --channel rc resolves the version from the npm rc
        # dist-tag instead - a separate code path with its own failure modes.
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/rc-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh --channel rc \
            --no-setup --no-modify-path --install-dir "$HOME/orq" < /dev/null
          # Captured, not piped: sh has no pipefail, so a binary that printed a
          # version and then failed would be judged by head's exit status.
          rc_version="$("$HOME/orq/orq" --version)"
          printf '%s\n' "$rc_version" | head -n 1 | grep -q -- '-rc\.'
      - name: upgrade over an existing install
        # The first job installs into a fresh dir, so `previous` stays empty and
        # the whole upgrade/rollback block never runs. This one exercises it.
        run: |
          export HOME="$RUNNER_TEMP/upgrade-home"
          mkdir -p "$HOME"
          SHELL=/bin/bash setsid dash install.sh --no-setup --install-dir "$HOME/orq" < /dev/null
          SHELL=/bin/bash setsid dash install.sh --no-setup --install-dir "$HOME/orq" < /dev/null
          test -x "$HOME/orq/orq"
          test ! -e "$HOME/orq/orq.previous"   # cleaned up once the new binary proved it runs
      - name: a failed download leaves the existing install alone
        # Fails at the download, before the upgrade block, so this covers the
        # early-exit path only. The rollback block itself (probe fails, previous
        # restored) still has no CI fixture — it needs a release that downloads
        # and does not run.
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/rollback-home"
          mkdir -p "$HOME/orq"
          printf '#!/bin/sh\necho "orq version 0.0.0-sentinel"\n' > "$HOME/orq/orq"
          chmod +x "$HOME/orq/orq"
          if SHELL=/bin/bash setsid dash install.sh --no-setup \
               --install-dir "$HOME/orq" --version v0.0.0-does-not-exist < /dev/null; then
            echo "installer exited 0 on a release that does not exist" >&2
            exit 1
          fi
          "$HOME/orq/orq" --version | grep -q 0.0.0-sentinel
      - name: reject non-ASCII in output
        # Covers only the static --help text; an ungated glyph in the install flow itself would still pass.
        run: |
          set -eu
          out=$(LC_ALL=C LANG=C dash install.sh --help)
          if printf '%s' "$out" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
            echo "--help emits non-ASCII under a C locale:" >&2
            printf '%s' "$out" | LC_ALL=C grep -nP '[^\x00-\x7F]' >&2
            exit 1
          fi

  rc:
    name: build, vet (orq-rc module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/orq-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/orq-rc/go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
