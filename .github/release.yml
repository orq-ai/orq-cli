# Categories GitHub uses for the auto-generated release notes ("What's Changed" +
# contributor list) that `gh release create --generate-notes` writes in
# .github/workflows/release-pipeline.yml. Those notes are PR-based with
# attributions; CHANGELOG.md remains the hand-written source of truth for the
# stability contract.
#
# Every label here is applied by .github/workflows/label-pr.yml — keep the two in
# sync, or a category silently stops matching anything.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance
      labels:
        - chore
        - ci
        - refactor
    - title: Other Changes
      labels:
        - "*"
