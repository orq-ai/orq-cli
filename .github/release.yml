# Categories GitHub uses for the auto-generated release notes ("What's Changed" +
# contributor list) that `gh release create --generate-notes` writes in
# .github/workflows/release-pipeline.yml. Those notes are PR-based with
# attributions; CHANGELOG.md remains the hand-written source of truth for the
# stability contract.
#
# The release:* namespace is reserved for .github/workflows/label-pr.yml. Keep
# these workflow-owned labels synchronized with that workflow's mapping.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - release:features
    - title: 🐛 Bug Fixes
      labels:
        - release:bug-fixes
    - title: 📚 Documentation
      labels:
        - release:documentation
    - title: 🧰 Maintenance
      labels:
        - release:maintenance
    - title: Other Changes
      labels:
        - "*"
